aid: docyt
name: Docyt
description: 'Docyt is a Silicon Valley accounting-automation company that sells AI-driven
  bookkeeping software to small and mid-sized businesses, accounting firms, and multi-property
  hospitality and franchise operators. The platform digitizes source documents, categorizes
  and matches transactions, runs continuous bank and merchant reconciliation, handles bill
  pay and expense management, and closes the books against a real-time general ledger that
  syncs with QuickBooks, NetSuite, Sage, Xero and Zoho. Products include the HpAI (High
  Precision Accounting Intelligence) engine, Accountant Copilot for firms, ClosingFlow for
  month-end close, and ProfitBooks for self-serve small-business bookkeeping. Docyt publishes
  no public developer program: there is no developer portal, no API reference, and no
  machine-readable specification. Its application backend at app.docyt.com exposes a private
  /api/v1 surface consumed only by its own web and mobile clients, and the customer knowledge
  base redirects to a tenant sign-in.'
